              <p style="margin:0 0 24px 0;color:#ffffff;font-size:16px;line-height:1.6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">You have been invited to join Bull &amp; Bear. Follow the link below to accept the invitation and create your account.</p><p style="margin:0 0 24px 0;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 28px;background-color:#3B82F6;color:#ffffff;text-decoration:none;font-weight:600;border-radius:8px;font-size:16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">Accept the invite</a></p><div style="margin-top:32px;border-top:1px solid #334155;padding-top:24px;"><p style="margin:0 0 8px 0;color:#ffffff;font-size:14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">If the button doesn't work, copy and paste this link into your browser:</p><a href="{{ .ConfirmationURL }}" style="color:#93C5FD;font-size:14px;word-break:break-all;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">{{ .ConfirmationURL }}</a></div>
